args = "--filter-tcp=80,443 --dpi-desync=fakedsplit --dpi-desync-split-pos=1,midsld --dpi-desync-fooling=ts --dpi-desync-repeats=6 --new --filter-udp=443 --dpi-desync=fake --dpi-desync-repeats=8"

[[strategy]]
name = "nfqws-quic-fake-only"
category = "quic"
description = "QUIC/UDP 443 fake burst paired with TCP split2"
args = "--filter-tcp=80,443 --dpi-desync=split2 --dpi-desync-split-pos=1,midsld --new --filter-udp=443 --dpi-desync=fake --dpi-desync-repeats=11"
