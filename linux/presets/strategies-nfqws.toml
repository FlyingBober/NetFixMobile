# Curated zapret nfqws strategies for Linux NetFix
# Note: --qnum and --dpi-desync-fwmark are pinned at runtime by netfix-core::dpi.

[[strategy]]
name = "nfqws-fake-multisplit-badseq"
category = "general"
description = "Fake + multisplit at SNI/midsld with badseq fooling and QUIC fake"
args = "--filter-tcp=80,443 --dpi-desync=fake,multisplit --dpi-desync-split-pos=1,midsld --dpi-desync-repeats=6 --dpi-desync-fooling=badseq --new --filter-udp=443 --dpi-desync=fake --dpi-desync-repeats=6"

[[strategy]]
name = "nfqws-fake-multisplit-md5sig"
category = "general"
description = "Fake + multisplit with md5sig fooling and QUIC fake"
args = "--filter-tcp=80,443 --dpi-desync=fake,multisplit --dpi-desync-split-pos=1,midsld --dpi-desync-repeats=6 --dpi-desync-fooling=md5sig --new --filter-udp=443 --dpi-desync=fake --dpi-desync-repeats=6"

