[[strategy]]
name = "nfqws-multisplit-seqovl"
category = "youtube"
description = "Multisplit with sequence overlap for TLS ClientHello"
args = "--filter-tcp=443 --dpi-desync=multisplit --dpi-desync-split-seqovl=652 --dpi-desync-split-pos=2 --new --filter-udp=443 --dpi-desync=fake --dpi-desync-repeats=8"

[[strategy]]
name = "nfqws-fake-autottl"
category = "general"
