args = "--filter-tcp=80,443 --dpi-desync=fake,multisplit --dpi-desync-autottl=2 --dpi-desync-split-pos=1,midsld --dpi-desync-fooling=md5sig,badseq --new --filter-udp=443 --dpi-desync=fake --dpi-desync-repeats=6"

[[strategy]]
name = "nfqws-fake-fakedsplit-ts"
