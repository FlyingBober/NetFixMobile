# --- YouTube Video Strategies ---

[[strategy]]
name = "yt-redirector-googlevideo-split"
category = "youtube"
args = "-H :redirector.googlevideo.com -r5+s -s50+s -a1 -An -H :googlevideo.com -q5+s -s25+s -a1 -An -r5+s -s50+s -a1"

[[strategy]]
