[package]
name = "netfixctl"
version = "0.1.0"
edition = "2021"

[dependencies]
netfix-core = { path = "../netfix-core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
